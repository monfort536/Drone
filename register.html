<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyVision - Premium Drone Services</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%230EA5E9'><path d='M10 3c0 1.313-.304 2.508-.8 3.4a1.991 1.991 0 0 0-1.484-.38c-.28-.982-.482-2.015-.482-3.02 0-1.69.566-2.906 1.144-2.906.577 0 1.622 1.216 1.622 2.906zm-1.879 2.08a4.484 4.484 0 0 1-1.636 1.272 2.01 2.01 0 0 0-1.464-.53 4.298 4.298 0 0 0-.256-3.064c-.45-.8-1.56-1.39-1.92-1.226-.358.163.46 1.394 1.026 2.454.493.923 1.22 1.838 2.007 2.492a2.003 2.003 0 0 0 1.487 1.396 4.49 4.49 0 0 1-.504 1.98 2.008 2.008 0 0 0-1.56.09 4.3 4.3 0 0 0-2.453-1.89c-.87-.272-2.05-.13-2.128.263-.08.39.99.98 2.04 1.554.912.497 1.936.87 2.89 1.002a2.004 2.004 0 0 0 1.02 1.89c-.644.97-1.127 2.115-1.127 3.3 0 1.69.566 2.906 1.144 2.906.577 0 1.622-1.216 1.622-2.906 0-1.313-.304-2.508-.8-3.4a1.991 1.991 0 0 0-1.484-.38c-.28-.982-.482-2.015-.482-3.02 0-1.69.566-2.906 1.144-2.906.577 0 1.622 1.216 1.622 2.906zm1.88 4.84a4.484 4.484 0 0 1 1.636-1.272 2.01 2.01 0 0 0 1.464.53 4.298 4.298 0 0 0 .256 3.064c.45.8 1.56 1.39 1.92 1.226.358-.163-.46-1.394-1.026-2.454-.493-.923-1.22-1.838-2.007-2.492a2.003 2.003 0 0 0-1.487-1.396 4.49 4.49 0 0 1 .504-1.98 2.008 2.008 0 0 0 1.56-.09 4.3 4.3 0 0 0 2.453 1.89c.87.272 2.05.13 2.128-.263.08-.39-.99-.98-2.04-1.554-.912-.497-1.936-.87-2.89-1.002a2.004 2.004 0 0 0-1.02-1.89z'/></svg>">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
<section class="d-flex w-100 m-0 p-0" style="height: 100vh; overflow: hidden;">
    <!-- LEFT SIDE: Image + Brand -->
    <div class="d-none d-lg-flex col-lg-6 position-relative align-items-center justify-content-center" style="background: url('assets/images/hero/hero-2.jpg') center/cover;">
        <!-- Overlay -->
        <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(135deg, rgba(2,6,23,0.95) 0%, rgba(14,165,233,0.4) 100%);"></div>
        <div class="position-absolute top-0 start-0 w-100 h-100 opacity-25" style="background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px); background-size: 30px 30px; animation: panGrid 60s linear infinite;"></div>
        
        <div class="position-relative z-1 text-center text-white px-5 fade-up">
            <a href="index.html" class="text-decoration-none text-white d-inline-flex align-items-center display-5 fw-bold mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-2 mb-1"><rect x="9" y="9" width="6" height="6" rx="2"/><path d="M12 15v2"/><path d="M10 17h4"/><path d="M14 10l4-4"/><path d="M10 10L6 6"/><path d="M14 14l4 4"/><path d="M10 14l-4 4"/><ellipse cx="18" cy="6" rx="3" ry="1.5" transform="rotate(45 18 6)"/><ellipse cx="6" cy="6" rx="3" ry="1.5" transform="rotate(-45 6 6)"/><ellipse cx="18" cy="18" rx="3" ry="1.5" transform="rotate(-45 18 18)"/><ellipse cx="6" cy="18" rx="3" ry="1.5" transform="rotate(45 6 18)"/></svg>SKYVISION
            </a>
            <h2 class="fw-bold mb-3">Elevate Your Perspective</h2>
            <div class="mx-auto rounded-pill mb-4" style="width: 60px; height: 3px; background: var(--cyan);"></div>
            <p class="lead text-white-50 mx-auto" style="max-width: 400px; font-weight: 300;">Access your drone intelligence dashboard and manage your aerial projects.</p>
        </div>
    </div>

    <!-- RIGHT SIDE: Form -->
    <div class="col-12 col-lg-6 position-relative d-block" style="background-color: var(--white);  overflow-y: auto; height: 100vh;">
        
        <!-- Toggles (Top Right) -->
        <div class="position-absolute top-0 end-0 m-4 d-flex gap-2" style="z-index: 10;">
            <!-- RTL Toggle -->
            <button class="btn btn-sm btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center hover-bg-primary shadow-none" id="rtlToggle" title="Toggle RTL" style="width:40px; height:40px; transition:0.3s;">
                <span class="rtl-label">RTL</span>
            </button>
            <!-- Dark Mode Toggle -->
            <button class="btn btn-sm btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center hover-bg-primary shadow-none" id="themeToggle" title="Toggle Dark Mode" style="width:40px; height:40px; transition:0.3s;">
                <i class="bi bi-moon-stars" id="themeIcon"></i>
            </button>
        </div>

        <div class="w-100 fade-up mx-auto my-auto" style="max-width: 480px; padding: 5rem 2rem 6rem !important; transition-delay: 0.1s;">
            <div class="text-center mb-5 d-lg-none">
                <a href="index.html" class="text-decoration-none text-dark d-inline-flex align-items-center fs-2 fw-bold">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-primary me-2 mb-1"><rect x="9" y="9" width="6" height="6" rx="2"/><path d="M12 15v2"/><path d="M10 17h4"/><path d="M14 10l4-4"/><path d="M10 10L6 6"/><path d="M14 14l4 4"/><path d="M10 14l-4 4"/><ellipse cx="18" cy="6" rx="3" ry="1.5" transform="rotate(45 18 6)"/><ellipse cx="6" cy="6" rx="3" ry="1.5" transform="rotate(-45 6 6)"/><ellipse cx="18" cy="18" rx="3" ry="1.5" transform="rotate(-45 18 18)"/><ellipse cx="6" cy="18" rx="3" ry="1.5" transform="rotate(45 6 18)"/></svg>SKYVISION
                </a>
            </div>
            
            <h2 class="fw-bold mb-2 text-dark">Create an Account</h2>
            <p class="text-muted mb-4">Join SKYVISION for premium drone intelligence.</p>

            <div id="regAlert" class="alert alert-danger d-none small"></div>

            
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label fw-medium small text-muted">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" id="regName" class="form-control form-control-lg form-control-custom shadow-none" placeholder="John Doe"  minlength="2" pattern="^[A-Za-z\s]{2,}$" title="Please enter a valid name using only letters (minimum 2 characters)." required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small text-muted">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" id="regEmail" class="form-control form-control-lg form-control-custom shadow-none" placeholder="name@company.com" required>
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <label class="form-label fw-medium small text-muted">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" id="regPassword" class="form-control form-control-lg form-control-custom shadow-none" placeholder="••••••••" minlength="6" required>
<button class="btn btn-outline-secondary border-secondary border-opacity-25 text-muted toggle-password" type="button" style="z-index: 10;"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-medium small text-muted">Confirm</label>
                        <div class="input-group">
                            <span class="input-group-text bg-transparent text-muted"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" id="regConfirm" class="form-control form-control-lg form-control-custom shadow-none" placeholder="••••••••" minlength="6" required>
<button class="btn btn-outline-secondary border-secondary border-opacity-25 text-muted toggle-password" type="button" style="z-index: 10;"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input border-secondary shadow-none" id="regTerms" required>
                    <label class="form-check-label small text-muted" for="regTerms">I agree to the </label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold mb-4 shadow-sm transition-03">Create Account <i class="bi bi-arrow-right ms-2"></i></button>
                <p class="text-center small text-muted mb-0">Already have an account? <a href="login.html" class="text-dark fw-bold text-decoration-none hover-primary transition-03">Sign In</a></p>
            </form>
        
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/main.js"></script>
  <script src="assets/js/animations.js"></script>
</body>
</html>
